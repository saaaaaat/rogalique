name: Build Game Solution

on:
  push:
    branches:
      - main
      - features/next-task
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

    
      - name: Download and Setup SFML
        run: |
          Invoke-WebRequest -Uri "https://www.sfml-dev.org/files/SFML-2.5.1-windows-vc15-64-bit.zip" -OutFile "SFML.zip"
          Expand-Archive -Path "SFML.zip" -DestinationPath "."
          
          # Создаем папку SFML (если её нет) и переносим туда распакованный файл
          mkdir SFML
          Move-Item -Path "SFML-2.5.1" -Destination "SFML\SFML-2.5.1"

    
      - name: Verify SFML Paths
        run: |
          if (Test-Path "SFML\SFML-2.5.1\include") { Write-Host "SFML include path exists!" } else { Write-Host "SFML include path MISSING!"; exit 1 }


      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1

      - name: Build solution
        run: |
          msbuild Game.sln /p:Configuration=Release /p:Platform=x64


      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RogaliqueGame-Windows
          path: |
            ArkanoidGame/x64/Release/*.exe
            ArkanoidGame/x64/Release/*.dll
            ArkanoidGame/x64/Release/Resources/
