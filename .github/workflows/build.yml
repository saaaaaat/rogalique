name: Build Game Solution

on:
  push:
    branches:
      - main
     
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1

    
      - name: Build solution
        run: |
           msbuild Game.sln /p:Configuration=Release /p:Platform=x64 
