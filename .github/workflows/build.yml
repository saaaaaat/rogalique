name: Build Game Solution

on:
  push:
    branches:
      - main
      - features/next-task 
  pull_request:
    branches:
      - main
      - features/next-task
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest 

    steps:
      # Step 1: Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Set up MSBuild and Visual Studio
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1

      # Step 3: Build the solution
      - name: Build solution
        run: |
          msbuild Game.sln /p:Configuration=Release /p:Platform=x64

      # Step 4: Upload the build artifact 
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RogaliqueGame-Windows
          path: |
            ArkanoidGame/x64/Release/*.exe
            ArkanoidGame/x64/Release/*.dll
            ArkanoidGame/x64/Release/Resources/
