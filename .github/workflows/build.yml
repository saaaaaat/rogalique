name: Build Game Solution

on:
  push:
    branches:
      - main
      - features/next-task
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1

     
      - name: Check and Setup SFML
        run: |
          if (-Not (Test-Path "SFML\SFML-2.5.1\include")) {
              Write-Host "SFML not found, downloading..."
              Invoke-WebRequest -Uri "https://www.sfml-dev.org/files/SFML-2.5.1-windows-vc15-64-bit.zip" -OutFile "SFML.zip"
              Expand-Archive -Path "SFML.zip" -DestinationPath "."
              if (-Not (Test-Path "SFML")) { mkdir SFML }
              Move-Item -Path "SFML-2.5.1" -Destination "SFML\SFML-2.5.1"
          } else {
              Write-Host "SFML already exists, skipping download."
          }

      - name: Build solution
        run: |
          msbuild Game.sln /p:Configuration=Release /p:Platform=x64

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RogaliqueGame-Windows
          path: |
            ArkanoidGame/x64/Release/*.exe
            ArkanoidGame/x64/Release/*.dll
            ArkanoidGame/x64/Release/Resources/
